name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pdf-accessibility-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gate:
    name: Source gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Install Chromium
        working-directory: backend
        run: uv run --frozen playwright install --with-deps chromium
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install PDF rendering tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Run canonical source gate
        run: ./scripts/check.sh
      - name: Build container image
        run: docker build --tag pdf-accessibility-app:ci .
      - name: Smoke-test container health
        run: |
          set -euo pipefail
          container_name=pdf-accessibility-ci-smoke
          host_port=18081
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --publish "127.0.0.1:${host_port}:8001" \
            --env GEMINI_API_KEY= \
            --env GOOGLE_API_KEY= \
            --env LLM_API_KEY=check-only \
            --env LLM_BASE_URL=http://127.0.0.1:8000/v1 \
            --env LLM_MODEL=gemini-check \
            --env USE_DIRECT_GEMINI_PDF=false \
            --env DOCLING_SERVE_URL= \
            --env DOCLING_SERVE_TOKEN= \
            pdf-accessibility-app:ci

          health_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health"; then
              health_ok=true
              break
            fi
            sleep 1
          done

          if [[ "$health_ok" != true ]]; then
            docker logs "$container_name"
            exit 1
          fi

          (
            cd backend
            uv run --frozen python ../scripts/check_frontend_runtime.py \
              "http://127.0.0.1:${host_port}/"
          )
