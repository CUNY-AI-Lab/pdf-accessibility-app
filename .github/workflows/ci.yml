name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pdf-accessibility-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gate:
    name: Source checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
      - name: Set up Bun
        env:
          BUN_VERSION: "1.3.14"
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/bun-runtime"
          bin_dir="$RUNNER_TEMP/bin"
          npm install --ignore-scripts --no-package-lock --prefix "$runtime_dir" "@oven/bun-linux-x64-baseline@$BUN_VERSION"
          mkdir -p "$bin_dir"
          ln -sf "$runtime_dir/node_modules/@oven/bun-linux-x64-baseline/bin/bun" "$bin_dir/bun"
          ln -sf "$runtime_dir/node_modules/@oven/bun-linux-x64-baseline/bin/bun" "$bin_dir/bunx"
          export PATH="$bin_dir:$PATH"
          echo "$bin_dir" >> "$GITHUB_PATH"
          [[ "$(bun --version)" == "$BUN_VERSION" ]]
      - name: Verify pinned Chromium
        run: |
          set -euo pipefail
          test -d /ms-playwright
          chromium_dir="$(find /ms-playwright -maxdepth 1 -type d -name 'chromium-*' -print -quit)"
          test -n "$chromium_dir"
          printf 'Using prebuilt Chromium at %s\n' "$chromium_dir"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Install PDF rendering tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i \
            -e 's#^URIs: http://azure.archive.ubuntu.com/ubuntu/$#URIs: https://mirrors.edge.kernel.org/ubuntu/#' \
            -e 's#^URIs: http://security.ubuntu.com/ubuntu/$#URIs: https://mirrors.edge.kernel.org/ubuntu/#' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get install --no-install-recommends -y poppler-utils
      - name: Run canonical source gate
        run: ./scripts/check.sh

  container-gate:
    name: Container checks
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build container image
        run: docker build --tag pdf-accessibility-app:ci .
      - name: Verify container CA trust
        run: docker run --rm pdf-accessibility-app:ci python /usr/local/libexec/check_ca_trust.py
      # The local dummy endpoint refuses claims; this checks runner liveness only.
      - name: Smoke-test runner container health
        run: |
          set -euo pipefail
          container_name=pdf-accessibility-ci-smoke
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container_name" \
            --env RUNNER_WORKER_URL=http://127.0.0.1:9 \
            --env RUNNER_TOKEN=check-only \
            --env LLM_API_KEY=check-only \
            --env LLM_BASE_URL=http://127.0.0.1:8000/v1 \
            --env LLM_MODEL=check-model \
            --env DOCLING_SERVE_URL= \
            --env DOCLING_SERVE_TOKEN= \
            pdf-accessibility-app:ci

          health_ok=false
          for ((attempt = 1; attempt <= 150; attempt++)); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" == healthy ]]; then
              health_ok=true
              break
            fi
            sleep 1
          done

          if [[ "$health_ok" != true ]]; then
            docker logs "$container_name"
            exit 1
          fi

  source-gate-result:
    name: Source gate
    if: ${{ always() }}
    needs:
      - source-gate
      - container-gate
    runs-on: ubuntu-latest
    steps:
      - name: Require source and container checks
        env:
          SOURCE_RESULT: ${{ needs.source-gate.result }}
          CONTAINER_RESULT: ${{ needs.container-gate.result }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RESULT" == success ]]
          [[ "$CONTAINER_RESULT" == success ]]
