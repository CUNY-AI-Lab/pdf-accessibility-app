services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_LOCAL_DOCLING: ${WITH_LOCAL_DOCLING:-false}
    env_file:
      - .env
    environment:
      RUNNER_ALIVE_FILE: /tmp/runner-alive
      UPLOAD_DIR: /app/data/uploads
      PROCESSING_DIR: /app/data/processing
      OUTPUT_DIR: /app/data/output
    volumes:
      - pdf_accessibility_data:/app/data
      - pdf_accessibility_cache:/home/app/.cache
    stop_grace_period: 1m
    restart: unless-stopped

volumes:
  pdf_accessibility_data:
  pdf_accessibility_cache:
